[package]
name = "buzzclaw"
version = "0.1.0"
edition = "2021"
authors = ["buzzster"]
description = "Fast, small autonomous AI agent infrastructure — deployable anywhere. Trait-driven architecture, built-in memory, multi-platform bots."
keywords = ["ai", "agent", "autonomous", "assistant", "multiplatform"]
categories = ["command-line-utilities", "asynchronous"]
rust-version = "1.87"

[dependencies]
# Async
tokio = { version = "1.42", default-features = false, features = [
  "rt-multi-thread", "macros", "time", "io-util", "sync", "process", "io-std", "fs", "net",
] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"

# Config
directories = "6.0"
toml = "1.0"

# Logging
tracing = { version = "0.1", default-features = false }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Memory / persistence
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# UUID
uuid = { version = "1.11", default-features = false, features = ["v4", "std"] }

# Allocators (optional)
mimalloc = { version = "0.1", optional = true }
jemallocator = { version = "0.5", optional = true }

# HTML to text (web fetch)
nanohtml2text = "0.2"

# URL encoding
urlencoding = "2.1"

# JNI (Android)
jni = { version = "0.21", optional = true }

[features]
default = []
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:jemallocator"]
jni = ["dep:jni"]

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
split-debuginfo = "off"
incremental = false

[profile.release-public]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
